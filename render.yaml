services:
  - type: web
    name: contentagent-api
    runtime: node
    plan: free
    # WHY: single instance — jobsMemory / in-process SSE maps are not shared across
    # replicas; multi-instance would show inconsistent live job progress (CLAUDE.md §9).
    numInstances: 1
    rootDir: server
    # WHY puppeteer browsers install after build: npm install often skips Chrome
    # download (blocked install scripts / cache miss). Without an explicit install
    # into PUPPETEER_CACHE_DIR (project-local so the slug upload includes it),
    # carousel PNG export fails with "Could not find Chrome" on Render.
    # WHY migrate in buildCommand on free: Render's preDeployCommand is paid-only.
    # A failed migrate still fails the build (non-zero exit). On a paid plan, prefer
    # moving migrate back to preDeployCommand so a bad migration blocks cutover
    # without re-running the full client/SSR/Chrome build — see CLAUDE.md §12.
    buildCommand: npm install --include=dev && npm --prefix ../client install --include=dev && npm run build && npm run db:migrate && npx puppeteer browsers install chrome
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      # WHY project-local cache: /opt/render/.cache is not part of the uploaded
      # build slug — Chrome must live under the service root to survive deploy.
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/server/.cache/puppeteer
      - key: CLERK_TELEMETRY_DISABLED
        value: '1'
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # WHY required: server/src/config.ts hard-requires CLERK_PUBLISHABLE_KEY at
      # boot (clerkMiddleware). Omitting it from the Blueprint left deploys
      # failing until the key was added manually in the Render dashboard.
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_TOKEN
        sync: false
      - key: OAUTH_STATE_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: RATE_LIMIT_MAX_JOBS
        value: '10'
      - key: PUPPETEER_EXECUTABLE_PATH
        sync: false
