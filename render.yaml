services:
  - type: web
    name: contentagent-api
    runtime: node
    plan: free
    rootDir: server
    # WHY puppeteer browsers install after build: npm install often skips Chrome
    # download (blocked install scripts / cache miss). Without an explicit install
    # into PUPPETEER_CACHE_DIR (project-local so the slug upload includes it),
    # carousel PNG export fails with "Could not find Chrome" on Render.
    buildCommand: npm install --include=dev && npm --prefix ../client install --include=dev && npm run build && npx puppeteer browsers install chrome
    # WHY preDeployCommand, not folded into buildCommand: Render runs this after a successful
    # build but before traffic is cut over to the new deploy, and (unlike buildCommand) it fails
    # the deploy outright if the command exits non-zero — a broken migration blocks the rollout
    # instead of shipping a server whose code expects a schema that was never applied. See
    # CLAUDE.md §12 for what to do if this step fails mid-deploy.
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      # WHY project-local cache: /opt/render/.cache is not part of the uploaded
      # build slug — Chrome must live under the service root to survive deploy.
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/server/.cache/puppeteer
      - key: CLERK_TELEMETRY_DISABLED
        value: '1'
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # WHY required: server/src/config.ts hard-requires CLERK_PUBLISHABLE_KEY at
      # boot (clerkMiddleware). Omitting it from the Blueprint left deploys
      # failing until the key was added manually in the Render dashboard.
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_TOKEN
        sync: false
      - key: OAUTH_STATE_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: RATE_LIMIT_MAX_JOBS
        value: '10'
      - key: PUPPETEER_EXECUTABLE_PATH
        sync: false
