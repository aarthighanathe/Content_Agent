# ─────────────────────────────────────────────────────────────────────────────
# LOCAL DEVELOPMENT ONLY — not used for production deployment.
#
# Production runs client on Vercel, server on Render, database on Neon
# (managed Postgres), and queue/cache on Upstash (managed Redis) — see
# render.yaml, client/vercel.json, and CLAUDE.md §3/§8 for the real deploy path.
#
# This file exists purely as a convenience so you can develop against a local
# Postgres + Redis instead of hitting your Neon/Upstash free-tier quota while
# iterating. The `server` service below still expects Neon/Upstash env vars by
# default (server/.env) — point DATABASE_URL / REDIS_URL at the local
# `postgres` / `redis` services below if you want a fully offline dev loop.
# ─────────────────────────────────────────────────────────────────────────────

# syntax = docker/compose/compose-spec-v2.2

version: '3.8'

services:
  # Frontend service (dev server, not the Vercel production build)
  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:3001
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/dist
    restart: unless-stopped

  # Backend service (dev server, not the Render production deployment)
  server:
    build: ./server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - UPSTASH_REDIS_URL=${UPSTASH_REDIS_URL:-redis://redis:6379}
      - UPSTASH_REDIS_TOKEN=${UPSTASH_REDIS_TOKEN}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - OAUTH_STATE_SECRET=${OAUTH_STATE_SECRET}
      - SENTRY_DSN=${SENTRY_DSN}
    depends_on:
      - redis
    volumes:
      - ./server:/app
      - /app/node_modules
      - /app/dist
    restart: unless-stopped

  # Local Redis stand-in for Upstash — dev only
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Local Postgres stand-in for Neon — dev only
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-contentagent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
