<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>ContentAgent — AI-powered content that converts</title>
    <meta name="description" content="Multi-agent AI system that researches trends, writes platform-optimized content, and self-improves until it meets quality standards." />
    <meta name="theme-color" content="#080808" />

    <!-- WHY: sets data-theme synchronously before first paint, so a persisted
         non-default theme never flashes the Aurora default on load. Must stay
         inline and run before any stylesheet/app script.
         WHY the allowlist check: store.ts's readStoredTheme() validates the
         stored value against VALID_THEMES before trusting it and falls back
         to 'aurora' otherwise — this script previously applied any stored
         value unchecked, so a stale/invalid theme key (removed in a future
         refactor, or manual tampering) would set a data-theme matching no
         CSS block, producing exactly the unstyled-content flash this script
         exists to prevent until React mounts and corrects it. Keep this list
         in sync with store.ts's VALID_THEMES. -->
    <script>
      (function () {
        try {
          var validThemes = ['aurora', 'deep-marine', 'obsidian-ember', 'nightshade', 'ink-verdigris', 'carbon-signal'];
          var t = localStorage.getItem('contentagent-theme');
          if (t && validThemes.indexOf(t) !== -1) document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>

    <link rel="canonical" href="https://content-agent-six-chi.vercel.app/" />
