name: ContentAgent CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        node-version: ['20', '22']
    uses: ./.github/workflows/_reusable-build.yml
    with:
      node-version: ${{ matrix.node-version }}

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd server && npm ci
          cd ../client && npm ci

      - name: Check for dependencies with known vulnerabilities
        run: |
          # Non-blocking: full report (including moderate) stays visible in the
          # log for awareness, but moderate alone must not fail the build.
          cd server && npm audit --audit-level moderate || true
          cd ../client && npm audit --audit-level moderate || true

      - name: Fail on high/critical vulnerabilities
        run: |
          # Blocking gate: high or critical severity fails the workflow.
          # Scoped to high+ (not moderate) since moderate may be too noisy to
          # gate on immediately — see the non-blocking step above for those.
          #
          # KNOWN ACCEPTED EXCEPTION: GHSA-qwww-vcr4-c8h2 (react-router, "RSC
          # Mode CSRF Bypass") is allowlisted below. It only affects React
          # Router's RSC/framework-mode APIs; this app is a plain Vite SPA
          # using <BrowserRouter> with zero RSC/framework-mode code (verified
          # 2026-08-06 — no react-router.config.ts, no unstable_RSC usage
          # anywhere in client/src). No patched react-router-dom 7.x exists
          # yet, and 8.x drops the -dom package entirely (a larger migration
          # than a security patch warrants). Re-check this exception whenever
          # react-router-dom is next touched — remove it once a real fix
          # lands, don't let it become permanent by inertia.
          ALLOWLISTED_ADVISORIES="GHSA-qwww-vcr4-c8h2"
          for dir in server client; do
            (
              cd "$dir"
              json=$(npm audit --audit-level=high --json || true)
              real_findings=$(echo "$json" | node -e "
                const raw = require('fs').readFileSync(0, 'utf8');
                const data = JSON.parse(raw);
                const allowed = new Set('$ALLOWLISTED_ADVISORIES'.split(' '));
                const ids = new Set();
                for (const vuln of Object.values(data.vulnerabilities || {})) {
                  if (vuln.severity !== 'high' && vuln.severity !== 'critical') continue;
                  for (const via of vuln.via) {
                    if (typeof via !== 'object' || !via.url) continue;
                    const id = via.url.split('/').pop();
                    if (!allowed.has(id)) ids.add(id + ' (' + vuln.name + ', ' + vuln.severity + ')');
                  }
                }
                console.log([...ids].join('\n'));
              ")
              if [ -n "$real_findings" ]; then
                echo "::error::Unallowlisted high/critical vulnerabilities in $dir:"
                echo "$real_findings"
                exit 1
              fi
              echo "$dir: no unallowlisted high/critical vulnerabilities"
            )
          done
